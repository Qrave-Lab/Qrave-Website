name: Website CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Lint and E2E are reported but don't block yet (existing lint debt;
      # E2E needs a running backend). Type check and unit tests must pass.
      - name: Run Lint
        continue-on-error: true
        run: npm run lint --if-present

      - name: Run Type Check
        run: npx tsc --noEmit

      - name: Run Unit Tests
        run: npx vitest run

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run E2E Tests
        continue-on-error: true
        run: npx playwright test
