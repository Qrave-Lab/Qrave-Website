name: Website CI

on:
  push:
    branches: [main, launch-readiness]
  pull_request:
    branches: [main]

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Type check, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Existing lint debt (errors and warnings): reported, not blocking yet.
      - name: Lint
        continue-on-error: true
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:9090
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_ROOT_DOMAIN: localhost
          NEXT_PUBLIC_EVENT_SERVICE_URL: http://localhost:9091
          NEXT_PUBLIC_ANALYTICS_URL: http://localhost:9092
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-placeholder
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ci-placeholder
        run: npm run build

  e2e:
    name: E2E (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # E2E needs a running backend, so it is reported but does not gate merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npx playwright test
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm audit --omit=dev --audit-level=high
